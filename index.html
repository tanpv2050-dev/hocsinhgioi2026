<!doctype html><html><head><base target="_top"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#182230;font:15px Arial}.top{background:#17365d;color:white;padding:17px 5%;display:flex;justify-content:space-between;gap:10px}.wrap{max-width:1050px;margin:24px auto;padding:0 14px}.card,.item{background:white;border:1px solid #e1e7ef;border-radius:11px;padding:17px;margin:12px 0}.login{max-width:410px;margin:9vh auto}h1{font-size:20px;margin:0}h2{font-size:18px}h3{font-size:16px}label{display:block;font-weight:bold;font-size:13px;margin:12px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font:inherit}textarea{min-height:130px}button{background:#1769aa;color:white;border:0;padding:10px 14px;border-radius:7px;cursor:pointer;font-weight:bold;margin:5px 5px 5px 0}.secondary{background:#e7edf4;color:#18324e}.tabs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:15px}.tabs button{background:#e7edf4;color:#18324e}.tabs button.active{background:#1769aa;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.muted{color:#667085;font-size:13px}.hidden{display:none}.notice{padding:10px;background:#eef6ff;border-radius:7px;margin-top:10px}.error{background:#fff0ef;color:#a1261b}.success{background:#eaf8ef;color:#087443}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:8px;border-bottom:1px solid #e5eaf0}.pill{font-size:12px;background:#edf2f7;padding:4px 8px;border-radius:20px}@media(max-width:600px){.top{flex-direction:column}}
</style></head><body><header class="top"><h1>Hệ thống quản lý đội tuyển Tin học</h1><span id="who"></span></header><main class="wrap">
<section id="login" class="card login"><h2>Đăng nhập</h2><p class="muted">Dùng tài khoản do giáo viên cấp.</p><label>Tên đăng nhập</label><input id="un" autocomplete="username"><label>Mật khẩu</label><input id="pw" type="password" autocomplete="current-password"><button onclick="signIn()">Đăng nhập</button><div id="loginMsg"></div></section>
<section id="app" class="hidden"><nav id="tabs" class="tabs"></nav><div id="view"></div></section></main>
<script>
let token="",me={},assignments=[],teams=[],users=[];const $=x=>document.getElementById(x);
function api(n,...a){return new Promise((ok,no)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>no(Error(e.message||e)))[n](...a))}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function note(s,k=""){return `<div class="notice ${k}">${esc(s)}</div>`}
async function signIn(){try{let r=await api("login",$("un").value,$("pw").value);token=r.token;me=r.user;boot()}catch(e){$("loginMsg").innerHTML=note(e.message,"error")}}
function boot(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=me.name+" · "+me.role;let p=[["home","Tổng quan"],["assign","Bài tập"]];if(me.role!=="STUDENT")p.push(["new","Tạo bài"],["subs","Bài nộp"],["users","Tài khoản"]);p.push(["pass","Đổi mật khẩu"],["out","Đăng xuất"]);$("tabs").innerHTML=p.map(x=>`<button id="t_${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");go("home")}
async function go(p){document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));$("t_"+p)?.classList.add("active");if(p==="out"){await api("logout",token);location.reload();return}if(p==="home")home();if(p==="assign")showAssignments();if(p==="new")newAssignment();if(p==="subs")submissionPage();if(p==="users")userPage();if(p==="pass")passwordPage()}
async function home(){let d=await api("dashboard",token);$("view").innerHTML=`<div class="grid"><div class="card"><div class="muted">Bài được giao</div><h2>${d.assignmentCount}</h2></div><div class="card"><div class="muted">Lượt nộp</div><h2>${d.submissionCount}</h2></div>${me.role!=="STUDENT"?`<div class="card"><div class="muted">Học sinh</div><h2>${d.studentCount}</h2></div>`:""}</div><div class="card"><h2>Xin chào ${esc(me.name)}</h2><p>Giai đoạn 1 quản lý giao bài và nhận bài nộp. Việc chấm điểm được thực hiện offline.</p></div>`}
async function showAssignments(){assignments=await api("listAssignments",token);$("view").innerHTML=`<h2>Danh sách bài tập</h2>`+(assignments.length?assignments.map(a=>`<div class="item"><h3>${esc(a.title)}</h3><p class="muted">Hạn: ${a.dueAt?new Date(a.dueAt).toLocaleString():"Không giới hạn"} · Tối đa ${a.maxAttempts} lượt · Đã nộp: ${a.attemptCount}</p><p>${esc(a.statement).slice(0,400)}${a.statement.length>400?"…":""}</p><button onclick="openAssignment('${a.id}')">Xem / nộp bài</button>${me.role!=="STUDENT"?`<button class="secondary" onclick="viewOverview('${a.id}')">Theo dõi bài nộp</button>`:""}</div>`).join(""):`<div class="card muted">Chưa có bài tập.</div>`)}
async function openAssignment(id){let [a,h]=await Promise.all([api("getAssignment",token,id),api("history",token,id)]);let left=Number(a.maxAttempts)-h.length;$("view").innerHTML=`<div class="card"><button class="secondary" onclick="showAssignments()">← Quay lại</button><h2>${esc(a.title)}</h2><p class="muted">Hạn: ${a.dueAt?new Date(a.dueAt).toLocaleString():"Không giới hạn"}</p><div style="white-space:pre-wrap;line-height:1.6">${esc(a.statement)}</div>${a.attachmentFileId?`<p><button class="secondary" onclick="downloadAttachment('${a.id}')">Tải file đề: ${esc(a.attachmentName)}</button></p>`:""}${me.role==="STUDENT"?`<hr><h3>Nộp bài</h3><p class="muted">Còn ${left} lượt. Tối đa 8 MB/file.</p><label>File bài làm</label><input id="file" type="file"><label>Ghi chú</label><textarea id="comment"></textarea><button id="send" onclick="sendFile('${id}')" ${left<=0?"disabled":""}>Gửi bài</button><div id="sendMsg"></div>`:""}<hr><h3>Lịch sử nộp</h3>${historyTable(h)}</div>`}
function historyTable(h){return h.length?`<table><tr><th>Lần</th><th>Thời gian</th><th>Tệp</th><th></th></tr>${h.map(s=>`<tr><td>${s.attempt}</td><td>${new Date(s.submittedAt).toLocaleString()}</td><td>${esc(s.fileName)}</td><td><button class="secondary" onclick="download('${s.id}')">Tải</button></td></tr>`).join("")}</table>`:`<p class="muted">Chưa có bài nộp.</p>`}
async function sendFile(id){let f=$("file").files[0];if(!f){$("sendMsg").innerHTML=note("Chọn file trước khi gửi.","error");return}if(f.size>8*1024*1024){$("sendMsg").innerHTML=note("File vượt quá 8 MB.","error");return}$("send").disabled=true;try{let b=await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f)});let r=await api("submit",token,{assignmentId:id,fileName:f.name,mimeType:f.type,base64:b,comment:$("comment").value});$("sendMsg").innerHTML=note("Đã nhận bài, lần nộp thứ "+r.attempt+".","success");openAssignment(id)}catch(e){$("sendMsg").innerHTML=note(e.message,"error");$("send").disabled=false}}
async function download(id){try{let d=await api("download",token,id),bin=atob(d.base64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);let url=URL.createObjectURL(new Blob([a],{type:d.mimeType})),el=document.createElement("a");el.href=url;el.download=d.fileName;el.click();URL.revokeObjectURL(url)}catch(e){alert(e.message)}}
async function newAssignment(){[teams,users]=await Promise.all([api("listTeams",token),api("listUsers",token)]);users=users.filter(x=>x.role==="STUDENT"&&x.active);$("view").innerHTML=`<div class="card"><h2>Tạo và giao bài</h2><label>Tên bài</label><input id="title"><label>Nội dung đề</label><textarea id="statement"></textarea><label>File đính kèm đề bài (không bắt buộc, tối đa 8 MB)</label><input id="attachment" type="file">
<label>Hạn nộp (để trống nếu không giới hạn)</label><input id="due" type="datetime-local"><label>Số lần nộp tối đa</label><input id="max" type="number" min="1" max="100" value="3"><label>Định dạng file cho phép</label><input id="ext" value="cpp,py,pas,java,zip,pdf,docx,txt"><label>Giao cho</label><select id="target" onchange="targetOptions()"><option value="ALL">Toàn đội tuyển</option><option value="TEAM">Một đội/nhóm</option><option value="USER">Một học sinh</option></select><div id="targetOpt"></div><button onclick="createAssignment()">Tạo bài và giao</button><div id="createMsg"></div></div>`}
function targetOptions(){let t=$("target").value;if(t==="ALL"){$("targetOpt").innerHTML="";return}let arr=t==="TEAM"?teams:users;$("targetOpt").innerHTML=`<label>Chọn đối tượng</label><select id="targetId">${arr.map(x=>`<option value="${x.id}">${esc(t==="TEAM"?x.name:x.name+" ("+x.username+")")}</option>`).join("")}</select>`}
async function createAssignment(){try{let t=$("target").value,f=$("attachment").files[0],attachmentBase64="";if(f){if(f.size>8*1024*1024)throw Error("File đề vượt quá 8 MB.");attachmentBase64=await readBase64(f)}await api("saveAssignment",token,{title:$("title").value,statement:$("statement").value,dueAt:$("due").value,maxAttempts:$("max").value,extensions:$("ext").value,targetType:t,targetId:t==="ALL"?"ALL":$("targetId").value,attachmentBase64,attachmentName:f?f.name:"",attachmentMimeType:f?f.type:""});$("createMsg").innerHTML=note("Đã tạo và giao bài.","success")}catch(e){$("createMsg").innerHTML=note(e.message,"error")}}
function readBase64(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f)})}
async function downloadAttachment(id){try{let d=await api("downloadAssignmentAttachment",token,id);let bin=atob(d.base64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);let url=URL.createObjectURL(new Blob([a],{type:d.mimeType})),el=document.createElement("a");el.href=url;el.download=d.fileName;el.click();URL.revokeObjectURL(url)}catch(e){alert(e.message)}}
async function submissionPage(){assignments=await api("listAssignments",token);$("view").innerHTML=`<div class="card"><h2>Quản lý bài nộp</h2><label>Chọn bài tập</label><select id="sel" onchange="viewOverview(this.value)"><option value="">-- Chọn --</option>${assignments.map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join("")}</select><div id="overview"></div></div>`}
async function viewOverview(id){if(!id)return;let data=await api("overview",token,id);$("overview").innerHTML=data.map(s=>`<div class="item"><h3>${esc(s.name)} (${esc(s.username)})</h3>${s.submissions.length?historyTable(s.submissions):`<p class="muted">Chưa nộp.</p>`}</div>`).join("")}
async function userPage(){[users,teams]=await Promise.all([api("listUsers",token),api("listTeams",token)]);$("view").innerHTML=`<div class="card"><h2>Tạo tài khoản</h2><div class="grid"><div><label>Tên đăng nhập</label><input id="uname"></div><div><label>Họ tên</label><input id="name"></div></div><div class="grid"><div><label>Mật khẩu ban đầu</label><input id="upass" type="password"></div><div><label>Vai trò</label><select id="role"><option value="STUDENT">Học sinh</option><option value="TEACHER">Giáo viên</option></select></div></div><label>Đội/nhóm (tùy chọn)</label><select id="team"><option value="">Chưa phân nhóm</option>${teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("")}</select><button onclick="addUser()">Tạo tài khoản</button><div id="userMsg"></div></div><div class="card"><h2>Danh sách tài khoản</h2><table><tr><th>Tài khoản</th><th>Họ tên</th><th>Vai trò</th></tr>${users.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${u.role}</td></tr>`).join("")}</table></div>${me.role==="ADMIN"?`<div class="card"><h2>Tạo đội/nhóm</h2><input id="teamName" placeholder="Tên đội/nhóm"><button onclick="addTeam()">Tạo nhóm</button><div id="teamMsg"></div></div>`:""}`}
async function addUser(){try{await api("saveUser",token,{username:$("uname").value,name:$("name").value,password:$("upass").value,role:$("role").value,teamId:$("team").value});$("userMsg").innerHTML=note("Đã tạo tài khoản.","success");userPage()}catch(e){$("userMsg").innerHTML=note(e.message,"error")}}
async function addTeam(){try{await api("saveTeam",token,{name:$("teamName").value});$("teamMsg").innerHTML=note("Đã tạo đội/nhóm.","success");userPage()}catch(e){$("teamMsg").innerHTML=note(e.message,"error")}}
function passwordPage(){$("view").innerHTML=`<div class="card" style="max-width:480px"><h2>Đổi mật khẩu</h2><label>Mật khẩu hiện tại</label><input id="old" type="password"><label>Mật khẩu mới</label><input id="newp" type="password"><button onclick="changePass()">Cập nhật</button><div id="passMsg"></div></div>`}
async function changePass(){try{await api("changePassword",token,$("old").value,$("newp").value);$("passMsg").innerHTML=note("Đã đổi mật khẩu.","success")}catch(e){$("passMsg").innerHTML=note(e.message,"error")}}
</script></body></html>
